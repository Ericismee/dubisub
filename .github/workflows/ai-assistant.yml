name: DubiSub AI assistant

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dubisub-ai-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  assistant:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          # Required for the action to fetch branches in this private repository.
          persist-credentials: true
      - name: Check provider configuration
        env:
          INTERN_TOKEN: ${{ secrets.INTERN_DISCOVERY_TOKEN }}
        run: |
          if [ -z "$INTERN_TOKEN" ]; then
            echo 'Missing repository secret INTERN_DISCOVERY_TOKEN.'
            exit 1
          fi
      - name: Run Claude Code with Intern Discovery
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        env:
          ANTHROPIC_BASE_URL: https://discovery-api.intern-ai.org.cn
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.INTERN_DISCOVERY_TOKEN }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        with:
          anthropic_api_key: ${{ secrets.INTERN_DISCOVERY_TOKEN }}
          trigger_phrase: '@claude'
          prompt: ${{ github.event_name == 'workflow_dispatch' && 'Read AGENTS.md and list three project rules in the workflow output. Do not edit files, push commits, or post comments. Identify the configured model honestly.' || '' }}
          claude_args: |
            --model deepseek-v4-flash-vision
            --max-turns 8
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://discovery-api.intern-ai.org.cn",
                "ANTHROPIC_MODEL": "deepseek-v4-flash-vision",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash-vision",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "deepseek-v4-flash-vision",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "deepseek-v4-flash-vision",
                "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
              }
            }
